name: Publish debug APK

# Build artifacts expire after 14 days and are only downloadable from the
# Actions UI. This publishes the same debug APK as a release asset so it has
# a stable, directly downloadable link.
on:
  workflow_dispatch:
  push:
    branches: ["claude/android-development-guide-xdp6dc"]
    paths:
      - ".github/workflows/release-apk.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APKs
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Collect the APKs worth publishing
        id: collect
        run: |
          mkdir -p dist
          SHA="${GITHUB_SHA::7}"
          # lite = no SMS permission, installs without Play Protect blocking
          cp app/build/outputs/apk/lite/debug/app-lite-arm64-v8a-debug.apk \
             "dist/kosha-lite-arm64-$SHA.apk"
          # full = automatic SMS capture; needs Play Protect turned off to install
          cp app/build/outputs/apk/full/debug/app-full-arm64-v8a-debug.apk \
             "dist/kosha-full-arm64-$SHA.apk"
          cp app/build/outputs/apk/full/debug/app-full-universal-debug.apk \
             "dist/kosha-full-universal-$SHA.apk"
          ls -la dist/

      - name: Verify no network permission before publishing
        run: python3 scripts/check_no_internet.py dist/*.apk

      - name: Publish as a rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${GITHUB_SHA::7}"
          gh release delete debug-latest --yes --cleanup-tag || true
          gh release create debug-latest dist/*.apk \
            --title "Kosha debug APK (latest)" \
            --notes "Unsigned debug build of $SHA.

          **kosha-full-arm64 — the one to use.** Every permission is declared, so
          SMS, Camera and Notifications all appear in Android's app info and you
          turn each on or off there. In-app: Home → Permissions shows the live
          state of each with a deep link.

          Installing it: Android blocks sideloaded apps that request SMS, so turn
          Play Protect scanning off for the install (Play Store → profile → Play
          Protect → gear → off), or use \`adb install\`. If the SMS toggle is then
          greyed out in app info, open its ⋮ menu → 'Allow restricted settings'.

          **kosha-lite-arm64** — fallback if the above is more trouble than it is
          worth. SMS permissions are compiled out, so it installs with no
          Play Protect fight and no SMS row in app info. Everything else is
          identical; only automatic bank-SMS capture is missing.

          **kosha-full-universal** — same as full, all four ABIs. Only for an
          x86 emulator.

          All builds are debug and unsigned." \
            --target "$GITHUB_SHA" \
            --prerelease

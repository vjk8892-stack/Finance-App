name: Publish debug APK

# Build artifacts expire after 14 days and are only downloadable from the
# Actions UI. This publishes the same debug APK as a release asset so it has
# a stable, directly downloadable link.
on:
  workflow_dispatch:
  push:
    branches: ["claude/android-development-guide-xdp6dc"]
    paths:
      - ".github/workflows/release-apk.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Name the APK with its commit
        id: rename
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/kosha-debug-${GITHUB_SHA::7}.apk"
          echo "path=dist/kosha-debug-${GITHUB_SHA::7}.apk" >> "$GITHUB_OUTPUT"
          ls -la dist/

      - name: Publish as a rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete debug-latest --yes --cleanup-tag || true
          gh release create debug-latest "${{ steps.rename.outputs.path }}" \
            --title "Kosha debug APK (latest)" \
            --notes "Unsigned debug build of ${GITHUB_SHA::7}. Sideload only — enable 'install from unknown sources'." \
            --target "$GITHUB_SHA" \
            --prerelease

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, unit tests, lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Needed only by the release step at the end of this job.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Engine unit tests (pure JVM)
        run: ./gradlew -p engines test --console=plain 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}

      - name: Unit tests (Android modules)
        run: ./gradlew test --console=plain 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}

      # Product flavors make the variant-specific lint task flavor-qualified.
      - name: Lint (full debug)
        run: ./gradlew :app:lintFullDebug --console=plain 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}

      - name: Assemble debug APKs (both flavors, per-ABI + universal)
        run: ./gradlew :app:assembleDebug --console=plain 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}

      # A Kotlin failure buries its "e:" lines under a ~300-line Gradle stack
      # trace, and log APIs hand back the tail — so the one thing worth reading
      # is the one thing that gets truncated away. Repeat it at the very end.
      - name: Compile errors
        if: failure()
        run: |
          echo "::group::Kotlin/KSP errors"
          grep -E "^e: |^w: .*error|FAILED$|Execution failed for task" build.log | head -60 || true
          echo "::endgroup::"

      # Spec B1 is a structural guarantee, and manifest merger can break it
      # from a transitive dependency without any code change.
      - name: Verify no network permission in any APK
        run: |
          find app/build/outputs/apk -name "*.apk" -print0 \
            | xargs -0 python3 scripts/check_no_internet.py

      - name: Record APK size baseline
        run: find app/build/outputs/apk -name "*.apk" -printf "%s\t%p\n" | sort -rn

      # The one APK worth installing, on its own.
      #
      # `kosha-debug-apk` below is every flavor crossed with every ABI split
      # plus the universals — six files that zip to over 200 MB, which you then
      # have to pick the right one out of by hand.
      #
      # arm64-v8a, not universal: the universal carries the native libraries
      # for BOTH architectures, so it is ~90 MB against ~44 MB for this one,
      # and every 64-bit Android phone (which is all of them for years now)
      # throws half of it away. armeabi-v7a in the full bundle covers genuinely
      # old 32-bit hardware.
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: kosha-install
          path: app/build/outputs/apk/full/debug/*arm64-v8a*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: kosha-debug-apk
          path: app/build/outputs/apk/**/debug/*.apk
          retention-days: 14

      # A download link that works without a GitHub account.
      #
      # Actions artifacts require the downloader to be SIGNED IN to GitHub, even
      # on a public repo, and a signed-out browser gets a bare 404 with no hint
      # that a login is the missing piece. Release assets carry no such rule.
      #
      # Tag and filenames match what the `debug-latest` release has used since
      # it was first put up by hand: three APKs, each stamped with the short
      # commit, so you can tell at a glance which build is on your phone. That
      # release then sat frozen on whatever commit last uploaded to it — this
      # step is what keeps it in step with the branch.
      #
      #   .../releases/download/debug-latest/kosha-full-arm64-<sha>.apk
      - name: Publish debug APKs to the debug-latest release
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          short=$(git rev-parse --short "$GITHUB_SHA")
          out=$(mktemp -d)
          cp app/build/outputs/apk/full/debug/*arm64-v8a*.apk "$out/kosha-full-arm64-$short.apk"
          cp app/build/outputs/apk/full/debug/*universal*.apk "$out/kosha-full-universal-$short.apk"
          cp app/build/outputs/apk/lite/debug/*arm64-v8a*.apk "$out/kosha-lite-arm64-$short.apk"

          # Recreated rather than edited: a release asset cannot be replaced in
          # place, and the filenames change with every commit, so editing would
          # pile up a new set of three on each build. --cleanup-tag stops the
          # tag pointing at a commit the assets no longer come from.
          gh release delete debug-latest --yes --cleanup-tag || true
          gh release create debug-latest "$out"/*.apk \
            --prerelease \
            --title "Kosha debug APK (latest)" \
            --notes "Debug build of \`$short\`.

          **Most phones: \`kosha-full-arm64-$short.apk\`.** \`full\` has SMS and camera
          capture; \`lite\` leaves them out. \`universal\` is only for genuinely old
          32-bit hardware and is twice the size because it carries both architectures.

          Debug builds install alongside a release build rather than over it, and are
          bigger than a release build. No INTERNET permission — verified on every build."

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-*.html
          retention-days: 7

  # The instrumented tests — undo/restore, multi-account attribution, the
  # migration harness and the vault-exclusion guarantee — had never once
  # executed. They need a device, the main job has none, and a test that has
  # never run is not evidence of anything. This job gives them one.
  #
  # Separate from the build job because an emulator adds several minutes and
  # is the flakiest thing in the pipeline; keeping it apart means a green
  # build still means "compiles, unit tests pass" without waiting on boot.
  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The Room Gradle plugin copies `core/database/schemas` into the
      # androidTest assets so MigrationTestHelper can read the old versions.
      # That directory is written by KSP during a normal compile, and asking
      # for `connectedDebugAndroidTest` on its own does not order the two — the
      # copy task fails input validation before a single test runs. Compiling
      # the library first puts the schemas on disk; the emulator step then
      # finds them. The `ls` is not decoration: if this ever stops producing
      # them, the failure should say so here rather than as an opaque
      # "directory doesn't exist" inside the emulator script.
      - name: Export Room schemas
        run: |
          ./gradlew :core:database:assembleDebug --console=plain
          ls -R core/database/schemas

      # KVM is what makes the emulator usable rather than glacial.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          ram-size: 4096M
          disable-animations: true
          # The library modules carry no product flavors — only :app does — so
          # the variant here is plain debug.
          # --continue: without it Gradle stops at the first failing module, so
          # one broken test in :core:database hid whether :feature:export's
          # tests ran at all. Every module's result, every run.
          script: ./gradlew :core:database:connectedDebugAndroidTest :feature:export:connectedDebugAndroidTest --continue --stacktrace

      - name: Upload instrumented reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-reports
          path: |
            **/build/reports/androidTests/
          retention-days: 7

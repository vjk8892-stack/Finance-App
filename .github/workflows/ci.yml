name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, unit tests, lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Engine unit tests (pure JVM)
        run: ./gradlew -p engines test --console=plain 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}

      - name: Unit tests (Android modules)
        run: ./gradlew test --console=plain 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}

      # Product flavors make the variant-specific lint task flavor-qualified.
      - name: Lint (full debug)
        run: ./gradlew :app:lintFullDebug --console=plain 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}

      - name: Assemble debug APKs (both flavors, per-ABI + universal)
        run: ./gradlew :app:assembleDebug --console=plain 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}

      # A Kotlin failure buries its "e:" lines under a ~300-line Gradle stack
      # trace, and log APIs hand back the tail — so the one thing worth reading
      # is the one thing that gets truncated away. Repeat it at the very end.
      - name: Compile errors
        if: failure()
        run: |
          echo "::group::Kotlin/KSP errors"
          grep -E "^e: |^w: .*error|FAILED$|Execution failed for task" build.log | head -60 || true
          echo "::endgroup::"

      # Spec B1 is a structural guarantee, and manifest merger can break it
      # from a transitive dependency without any code change.
      - name: Verify no network permission in any APK
        run: |
          find app/build/outputs/apk -name "*.apk" -print0 \
            | xargs -0 python3 scripts/check_no_internet.py

      - name: Record APK size baseline
        run: find app/build/outputs/apk -name "*.apk" -printf "%s\t%p\n" | sort -rn

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: kosha-debug-apk
          path: app/build/outputs/apk/**/debug/*.apk
          retention-days: 14

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-*.html
          retention-days: 7

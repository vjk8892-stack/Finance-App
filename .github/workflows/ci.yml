name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, unit tests, lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Engine unit tests (pure JVM)
        run: ./gradlew -p engines test --stacktrace

      - name: Unit tests (Android modules)
        run: ./gradlew test --stacktrace

      # Product flavors make the variant-specific lint task flavor-qualified.
      - name: Lint (full debug)
        run: ./gradlew :app:lintFullDebug --stacktrace

      - name: Assemble debug APKs (both flavors, per-ABI + universal)
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Record APK size baseline
        run: find app/build/outputs/apk -name "*.apk" -printf "%s\t%p\n" | sort -rn

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: kosha-debug-apk
          path: app/build/outputs/apk/**/debug/*.apk
          retention-days: 14

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-*.html
          retention-days: 7
